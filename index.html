<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0a0a0f;color:#fff;padding-bottom:80px}.top{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#0f0f18;border-bottom:1px solid #222}.logo-img{width:42px;height:42px;border-radius:12px}.brand{font-size:20px;font-weight:900}.banner{margin:12px;border-radius:18px;overflow:hidden;border:1px solid #2a2a3e}.banner img{width:100%;display:block}.sec{padding:14px 16px;font-weight:800;display:flex;justify-content:space-between}.hscroll{display:flex;gap:10px;overflow-x:auto;padding:0 16px 10px}.card{min-width:160px;background:#1c1c2e;border-radius:16px;padding:14px;border:1px solid #2a2a4a;position:relative}.badge{position:absolute;top:-6px;right:8px;padding:3px 7px;border-radius:8px;font-size:8px;font-weight:900}.new{background:#4ade80;color:#000}.hot{background:#facc15;color:#000}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}.tool{background:#1c1c1e;border-radius:16px;padding:14px;border:1px solid #2a2a3a}.ask{position:fixed;bottom:68px;left:10px;right:10px;background:#1e1e2e;border-radius:28px;display:flex;padding:5px 5px 5px 16px;border:1px solid #333}.ask input{flex:1;background:transparent;border:none;color:#fff;outline:none}.tabs{position:fixed;bottom:0;left:0;right:0;height:58px;background:#0f0f18;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;color:#666;font-size:11px}.chat{position:fixed;inset:0;background:#0b0b14;z-index:99;display:none;flex-direction:column}.chat.on{display:flex}.cbox{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}.m{max-width:82%;padding:10px 12px;border-radius:14px;font-size:13px;white-space:pre-wrap}.me{background:#a855f7;align-self:flex-end}.ai{background:#1e1e2e;align-self:flex-start}</style></head><body>
<div class="top"><img src="logo.png" class="logo-img"><div class="brand">XENA AI</div><div style="margin-left:auto;font-size:10px;background:#a855f7;padding:4px 10px;border-radius:20px">V14 CAPCUT</div></div>

<script>
let hist=JSON.parse(localStorage.getItem('xena14')||'[]');
function openAI(p){document.getElementById('chat').classList.add('on');if(p){document.getElementById('cinput').value=p;setTimeout(send,300);}render();}
function closeAI(){document.getElementById('chat').classList.remove('on');}
function fromBar(){let v=document.getElementById('askBar').value.trim();if(!v)return;document.getElementById('askBar').value='';openAI(v);}
function render(){let b=document.getElementById('cbox');b.innerHTML=hist.map(h=>`<div class="m ${h.r}">${h.t}</div>`).join('');b.scrollTop=999999;}
async function send(){let i=document.getElementById('cinput');let q=i.value.trim();if(!q)return;hist.push({r:'me',t:q});i.value='';render();hist.push({r:'ai',t:'XENA typing...'});render();try{let r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:q}]}]})});let d=await r.json();if(d.error)throw new Error(d.error.message);let a=d.candidates[0].content.parts[0].text;hist.pop();hist.push({r:'ai',t:a});document.getElementById('stat').innerText='Online ✅';}catch(e){hist.pop();hist.push({r:'ai',t:'Error: '+e.message});}localStorage.setItem('xena14',JSON.stringify(hist));render();}
render();
