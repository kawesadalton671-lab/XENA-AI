<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XENA</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0d0d0d;color:#fff;padding-bottom:120px}.top{padding:14px;font-size:22px;font-weight:900}.sec{padding:14px;font-weight:700}.hscroll{display:flex;gap:10px;overflow-x:auto;padding:0 14px 10px}.card{min-width:160px;background:#1c1c1e;border-radius:16px;padding:12px;border:1px solid #2a2a2e}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}.tool{background:#1c1c1e;border-radius:16px;padding:12px;border:1px solid #2a2a2e}.ask{position:fixed;bottom:70px;left:10px;right:10px;background:#1c1c1e;border-radius:28px;display:flex;padding:5px 5px 5px 14px;border:1px solid #333}.ask input{flex:1;background:transparent;border:none;color:#fff;outline:none}.tabs{position:fixed;bottom:0;left:0;right:0;height:60px;background:#0d0d0d;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;color:#666}.chat{position:fixed;inset:0;background:#0b141a;z-index:99;display:none;flex-direction:column}.chat.on{display:flex}.cbox{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}.m{max-width:80%;padding:10px;border-radius:12px;font-size:13px}.me{background:#005c4b;align-self:flex-end}.ai{background:#202c33;align-self:flex-start}</style></head><body>
<div class="top">Open<span style="color:#4ade80">Chat</span> XENA</div>
<div class="sec">Premium Features</div>
<div class="hscroll">
<div class="card" onclick="openAI('Solve math')">🧩 AI Solver</div>
<div class="card" onclick="openAI('Analyze image')">🖼️ Image Tools</div>
<div class="card" onclick="openAI('Deep chat')">🐬 DeepSeek R1</div>
</div>
<div class="sec">Useful Tools</div>
<div class="grid">
<div class="tool" onclick="openAI('Generate image of Kampala')">✨ Image Generator</div>
<div class="tool" onclick="openAI('Write email')">✉️ Email Assistant</div>
<div class="tool" onclick="openAI('Tell me about Kampala Uganda')">🇺🇬 XENA Uganda</div>
<div class="tool" onclick="openAI('Who are you XENA?')">💬 XENA Chat</div>
</div>
<div class="ask"><input id="askBar" placeholder="Ask anything"><button onclick="fromBar()" style="width:40px;height:40px;border-radius:50%;background:#00e5a0;border:none">➤</button></div>
<div class="tabs"><div>Roles</div><div style="color:#00e5a0">Chats</div><div>Settings</div></div>
<div id="chat" class="chat"><div style="height:50px;background:#202c33;display:flex;align-items:center;padding:0 12px;gap:10px"><span onclick="closeAI()">←</span><b>XENA AI</b><span id="stat" style="margin-left:auto;font-size:9px;background:#a855f7;padding:4px 8px;border-radius:8px">READY</span></div><div id="cbox" class="cbox"></div><div style="padding:10px;background:#202c33;display:flex;gap:8px"><input id="cinput" placeholder="Ask XENA..." style="flex:1;height:40px;background:#2a3942;border:none;border-radius:20px;color:#fff;padding:0 12px;outline:none" onkeypress="if(event.key==='Enter')send()"><button onclick="send()" style="width:40px;height:40px;border-radius:50%;border:none;background:#00e5a0">➤</button></div></div>
<script>
const API_ KEY"AQ.Ab8RN6InVqe1UQPrRBAfICLfyHgecoquXxwy-MgOXUPl0BVt2g
let hist=JSON.parse(localStorage.getItem('x30')||'[]');
function openAI(p){document.getElementById('chat').classList.add('on');if(p){document.getElementById('cinput').value=p;setTimeout(send,300);}render()}
function closeAI(){document.getElementById('chat').classList.remove('on')}
function fromBar(){let v=document.getElementById('askBar').value.trim();if(!v)return;document.getElementById('askBar').value='';openAI(v)}
function render(){document.getElementById('cbox').innerHTML=hist.map(h=>`<div class="m ${h.r}">${h.t}</div>`).join('');document.getElementById('cbox').scrollTop=99999}
async function send(){let i=document.getElementById('cinput');let q=i.value.trim();if(!q)return;hist.push({r:'me',t:q});i.value='';render();hist.push({r:'ai',t:'typing...'});render();try{let r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:q}]}]})});let d=await r.json();if(d.error)throw new Error(d.error.message);let a=d.candidates[0].content.parts[0].text;hist.pop();hist.push({r:'ai',t:a});document.getElementById('stat').innerText="Online ✅"}catch(e){hist.pop();hist.push({r:'ai',t:"Error: "+e.message+"\nEnable Generative Language API at console.cloud.google.com"})}localStorage.setItem('x30',JSON.stringify(hist));render()}
render()
</script></body></html>
