<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XENA AI - Uganda Business AI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7C3AED">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.logo{font-size:70px;margin-bottom:10px}
h1{font-size:48px;color:#7C3AED;text-shadow:0 0 20px #7C3AED}
h2{color:#A78BFA;margin:10px 0 30px;font-weight:400}
.card{background:#111;border:1px solid #333;border-radius:20px;padding:25px;width:100%;max-width:420px;margin-top:20px}
.btn{background:linear-gradient(135deg,#7C3AED,#A78BFA);color:#fff;border:0;padding:18px 30px;border-radius:14px;font-size:19px;font-weight:700;width:100%;margin-top:20px;cursor:pointer}
.btn:active{transform:scale(0.98)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;text-align:left}
.item{background:#1a1a1a;padding:14px;border-radius:12px;font-size:14px;border:1px solid #222}
.item b{color:#7C3AED;display:block;margin-bottom:4px}
.footer{margin-top:40px;color:#555;font-size:13px}
</style>
</head>
<body>
<div class="logo">🔥</div>
<h1>XENA AI</h1>
<h2>Uganda's #1 Business AI Assistant</h2>

<div class="card">
<p>I'm Dalton's AI - Built for Ugandan Businesses</p>
<button class="btn" onclick="document.getElementById('chat').style.display='block';this.style.display='none'">💬 Chat with XENA</button>
<div id="chat" style="display:none;margin-top:20px">
<input id="msg" placeholder="Ask about eFris, URA, tax..." style="width:100%;padding:16px;border-radius:12px;border:1px solid #333;background:#000;color:#fff">
<button class="btn" onclick="let m=document.getElementById('msg').value;if(m){document.getElementById('reply').innerHTML='<p style=text-align:left;background:#1a1a1a;padding:15px;border-radius:12px;margin-top:15px>🚀 XENA: I got your question: <b>'+m+'</b><br><br>✅ eFris, URA, Airtel Money & BUBU support is active! Full AI brain is loading...</p>'}">Send</button>
<div id="reply"></div>
</div>

<div class="grid">
<div class="item"><b>📄 eFris</b>Invoice & Stock</div>
<div class="item"><b>🏦 URA</b>Tax Filing</div>
<div class="item"><b>📱 Airtel Money</b>Payments</div>
<div class="item"><b>🇺🇬 BUBU</b>Local Business</div>
</div>
</div>

<div class="footer">kawesadalton671-lab.github.io/XENA-AI<br>Made in Uganda 🇺🇬 by Dalton</div>

<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
