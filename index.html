<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XENA V5.3 WORKING</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050510;color:#fff;font-family:system-ui}
.head{background:linear-gradient(90deg,#6a00ff,#ff00a0);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:18px}
.support-btn{background:#fff;color:#6a00ff;border:none;padding:9px 16px;border-radius:25px;font-weight:900;font-size:13px;cursor:pointer}
.wrap{max-width:700px;margin:0 auto;padding:18px 14px 120px}
.msg{margin:14px 0;padding:16px 20px;border-radius:24px;line-height:1.8;font-size:15px;white-space:pre-wrap}
.user{background:linear-gradient(135deg,#7a00ff,#9a30ff);margin-left:auto;border-bottom-right-radius:6px;max-width:85%}
.bot{background:#16162a;border:1px solid #2a2a4a;border-bottom-left-radius:6px}
.bar{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,20,.95);backdrop-filter:blur(20px);border-top:1px solid #222;display:flex;padding:14px;max-width:700px;margin:0 auto;gap:10px}
input{flex:1;padding:16px 22px;border-radius:30px;border:1px solid #333;background:#1a1a2e;color:#fff;font-size:16px;outline:none}
button.send{background:linear-gradient(90deg,#6a00ff,#ff00a0);border:none;color:#fff;padding:16px 26px;border-radius:30px;font-weight:900;cursor:pointer}
.typing-dots{display:flex;gap:6px}
.typing-dots span{width:8px;height:8px;background:#9a30ff;border-radius:50%;animation:bounce 1.4s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-8px);opacity:1}}
#supportBox{display:none;position:fixed;top:70px;left:50%;transform:translateX(-50%);width:92%;max-width:380px;background:#1a1a2e;border:1px solid #6a00ff;border-radius:24px;padding:24px;z-index:30}
.close{position:absolute;top:12px;right:18px;font-size:22px;cursor:pointer}
</style>
</head>
<body>
<div class="head"><div class="logo">🔥 XENA V5.3 FIXED</div><button class="support-btn" onclick="toggleSupport()">SUPPORT 💬</button></div>
<div id="supportBox"><span class="close" onclick="toggleSupport()">✕</span><h3>XENA Support</h3><p>By Dalton - Kampala 🇺🇬</p></div>
<div class="wrap" id="chat"><div class="msg bot">Hi Dalton! V5.3 is FIXED! ✅

✅ SEND now works
✅ KEY is inside
✅ Typing • • •
✅ Steps like Meta AI

Try me!</div></div>
<div class="bar"><input id="q" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')send()"><button class="send" onclick="send()">SEND</button></div>

<script>
const KEY="AQ.Ab8RN6IESzisKBOl60soehyUX7nltU1TlIjUWc5fgJ-MEDNcCg";
const SYSTEM="You are XENA World Brain built by Dalton in Kampala. Answer EXACTLY like Meta AI: short intro, then **bold headings**, - bullets, 2-3 sections, steps style, friendly.";
function toggleSupport(){let s=document.getElementById('supportBox');s.style.display=s.style.display==='block'?'none':'block';}
async function send(){
let i=document.getElementById('q'),t=i.value.trim();
if(!t)return;
let c=document.getElementById('chat');
c.innerHTML+=`<div class="msg user">${t}</div>`;
i.value='';
let b=document.createElement('div');
b.className='msg bot';
b.innerHTML='<div class="typing-dots"><span></span><span></span><span></span></div>';
c.appendChild(b);
window.scrollTo(0,document.body.scrollHeight);
try{
let r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+KEY,{
method:'POST',
headers:{'Content-Type':'application/json','x-goog-api-key':KEY},
body:JSON.stringify({contents:[{parts:[{text:SYSTEM+"\n\nQ: "+t}]}]})
});
let d=await r.json();
let txt=d.candidates?.[0]?.content?.parts?.[0]?.text;
if(txt){b.innerText=txt;window.scrollTo(0,document.body.scrollHeight);return;}
throw new Error('key fail');
}catch(e){
try{
let r2=await fetch('https://text.pollinations.ai/'+encodeURIComponent(SYSTEM+" Question: "+t));
b.innerText=await r2.text();
}catch(e2){b.innerText="Error, try again: "+e2.message;}
}
window.scrollTo(0,document.body.scrollHeight);
}
</script>
</body>
</html>
