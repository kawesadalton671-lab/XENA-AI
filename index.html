<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XENA V4 - Meta Style</title><style>*{box-sizing:border-box}body{margin:0;background:#050510;color:#fff;font-family:system-ui}.head{background:linear-gradient(90deg,#6a00ff,#ff00a0);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.logo{font-weight:900;font-size:18px}.support-btn{background:#fff;color:#6a00ff;border:none;padding:9px 16px;border-radius:25px;font-weight:900;font-size:13px;cursor:pointer}.wrap{max-width:700px;margin:0 auto;padding:18px 14px 120px}.msg{margin:14px 0;padding:16px 20px;border-radius:24px;line-height:1.8;font-size:15px;white-space:pre-wrap}.user{background:linear-gradient(135deg,#7a00ff,#9a30ff);margin-left:auto;border-bottom-right-radius:6px;max-width:85%}.bot{background:#16162a;border:1px solid #2a2a4a;border-bottom-left-radius:6px}.bar{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,20,.95);backdrop-filter:blur(20px);border-top:1px solid #222;display:flex;padding:14px;max-width:700px;margin:0 auto;gap:10px}input{flex:1;padding:16px 22px;border-radius:30px;border:1px solid #333;background:#1a1a2e;color:#fff;font-size:16px;outline:none}button.send{background:linear-gradient(90deg,#6a00ff,#ff00a0);border:none;color:#fff;padding:16px 26px;border-radius:30px;font-weight:900;cursor:pointer}#supportBox{display:none;position:fixed;top:70px;left:50%;transform:translateX(-50%);width:92%;max-width:380px;background:#1a1a2e;border:1px solid #6a00ff;border-radius:24px;padding:24px;z-index:30}.close{position:absolute;top:12px;right:18px;font-size:22px;cursor:pointer}</style></head><body>
